[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent-cli"
version = "0.4.0"
description = "A local CLI coding agent."
readme = "README.MD"
requires-python = ">=3.10"
authors = [{ name = "Deepak Yadav" }]
license = "MIT"
keywords = ["ai", "coding", "agent", "cli", "llm"]

dependencies = [
    "click>=8.1",
    "openai>=1.30",
    "platformdirs>=4.0",
    "pydantic>=2.5",
    "rich>=13.0",
    "tiktoken>=0.5",
    "tomli>=2.0",
    "tomli-w>=1.0",
    "ddgs",
    "httpx>=0.27",
]

[project.scripts]
# Creates the global `codeagent` command. When the package is installed,
# pip generates an executable that runs codeagent/main.py -> main().
codeagent = "codeagent.main:main"

# All code lives inside the single `codeagent` package, so nothing generic
# like `config` or `utils` gets installed at the top level of site-packages.
[tool.setuptools.packages.find]
include = ["codeagent*"]